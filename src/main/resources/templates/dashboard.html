<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="conteudo" id="dashboard" th:attr="data-api-url=@{/api/dashboard}">
        <div class="container-fluid">
            <h2 class="mb-4">
                <i class="bi bi-speedometer2"></i>
                Dashboard Administrativo
            </h2>

            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Filtrar vendas</h5>
                    <form id="filtroDashboard">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="inicio" class="form-label">
                                    Data inicial
                                </label>
                                <input type="date" id="inicio" class="form-control">
                            </div>

                            <div class="col-md-4">
                                <label for="fim" class="form-label">
                                    Data final
                                </label>
                                <input type="date" id="fim" class="form-control">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">

                                <button type="submit" id="botaoFiltrar" class="btn btn-primary me-2">
                                    <i class="bi bi-funnel"></i>
                                    Filtrar
                                </button>

                                <button type="button" id="botaoAtualizar" class="btn btn-secondary">
                                    <i class="bi bi-arrow-clockwise"></i>
                                    Atualizar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="mensagemDashboard" class="mb-3" role="status" aria-live="polite"></div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card indicador-card">
                        <div class="card-body">
                            <h5>Total de pedidos</h5>
                            <h2 id="totalPedidos">--</h2>
                            <i class="bi bi-bag"></i>
                        </div>
                    </div>
                </div>


                <div class="col-md-4">
                    <div class="card indicador-card">
                        <div class="card-body">
                            <h5>Pedidos finalizados</h5>
                            <h2 id="pedidosFinalizados">--</h2>
                            <i class="bi bi-check-circle"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card indicador-card">
                        <div class="card-body">
                            <h5>Pedidos cancelados</h5>
                            <h2 id="pedidosCancelados">--</h2>
                            <i class="bi bi-x-circle"></i>

                        </div>
                    </div>
                </div>


                <div class="col-md-6">
                    <div class="card indicador-card">
                        <div class="card-body">
                            <h5>Faturamento</h5>
                            <h2 id="faturamento">--</h2>
                            <i class="bi bi-cash-stack"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card indicador-card">
                        <div class="card-body">
                            <h5>Ticket médio</h5>
                            <h2 id="ticketMedio">--</h2>
                            <i class="bi bi-currency-dollar"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script defer th:src="@{/js/dashboard.js}"></script>
    </section>
</body>
</html>
