<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>
<div th:fragment="content">
    <input type="hidden" id="csrfToken" th:value="${_csrf.token}">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Novo pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="mensagemAcao"></div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Cliente</th>
                    <th>Itens</th>
                    <th>Total</th>
                    <th>Responsável pelo pedido</th>
                    <th>Data de entrada</th>
                    <th>Responsável pela saída</th>
                    <th>Data de saída</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- Lista vazia -->
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="10" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Nenhum pedido encontrado.
                    </td>
                </tr>
                <!-- Linhas -->
                <tr th:each="pedido : ${pedidos}" th:attr="data-pedido-id=${pedido.id}">
                    <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                    <td th:text="${nomesClientes[pedido.clienteId] ?: 'Cliente não encontrado'}"></td>
                    <td>
                        <ul class="mb-0 ps-3" th:if="${pedido.itens != null}">
                            <li th:each="item : ${pedido.itens}">
                                <span th:text="${item.nomeProduto}"></span>
                                —
                                <span th:text="${item.quantidade}"></span>
                                x
                                <span th:text="${#numbers.formatDecimal(item.precoUnitario, 1, 2)}"></span>
                                =
                                <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                            </li>
                        </ul>
                    </td>
                    <td th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 2)}"></td>
                    <td th:text="${pedido.responsavelId}"></td>
                    <td th:text="${pedido.horarioEntrada != null ? #temporals.format(pedido.horarioEntrada, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td th:text="${pedido.responsavelSaidaId != null ? pedido.responsavelSaidaId : '-'}"></td>
                    <td th:text="${pedido.horarioSaida != null ? #temporals.format(pedido.horarioSaida, 'dd/MM/yyyy HH:mm') : '-'}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${pedido.status.name() == 'FINALIZADO'} ? 'bg-success' :
                                               (${pedido.status.name() == 'CANCELADO'} ? 'bg-danger' :
                                               (${pedido.status.name() == 'EM_PREPARO'} ? 'bg-warning text-dark' :
                                               (${pedido.status.name() == 'SAIU_PARA_ENTREGA'} ? 'bg-info text-dark' : 'bg-secondary')))"
                              th:text="${pedido.status}">
                        </span>
                    </td>
                    <td>
                        <button type="button"
                                class="btn btn-sm btn-outline-primary btn-avancar-status"
                                th:if="${pedido.status.name() == 'RECEBIDO'}"
                                th:attr="data-proximo-status='EM_PREPARO',data-pedido-id=${pedido.id}">
                            Avançar para preparo
                        </button>
                        <button type="button"
                                class="btn btn-sm btn-outline-primary btn-avancar-status"
                                th:if="${pedido.status.name() == 'EM_PREPARO'}"
                                th:attr="data-proximo-status='PRONTO',data-pedido-id=${pedido.id}">
                            Marcar como pronto
                        </button>
                        <button type="button"
                                class="btn btn-sm btn-outline-primary btn-avancar-status"
                                th:if="${pedido.status.name() == 'PRONTO'}"
                                th:attr="data-proximo-status='SAIU_PARA_ENTREGA',data-pedido-id=${pedido.id}">
                            Registrar saída
                        </button>
                        <button type="button"
                                class="btn btn-sm btn-outline-primary btn-avancar-status"
                                th:if="${pedido.status.name() == 'SAIU_PARA_ENTREGA'}"
                                th:attr="data-proximo-status='FINALIZADO',data-pedido-id=${pedido.id}">
                            Finalizar
                        </button>
                        <span class="text-muted small"
                              th:if="${pedido.status.name() == 'FINALIZADO' or pedido.status.name() == 'CANCELADO'}">
                            Sem ações disponíveis
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        (() => {
            const csrfToken = document.getElementById("csrfToken")?.value;
            const mensagemAcao = document.getElementById("mensagemAcao");

            function mostrarMensagem(texto, tipo = "danger") {
                mensagemAcao.replaceChildren();
                const alerta = document.createElement("div");
                alerta.className = `alert alert-${tipo} mb-0 mt-2`;
                alerta.textContent = texto;
                mensagemAcao.appendChild(alerta);
            }

            document.querySelectorAll(".btn-avancar-status").forEach(botao => {
                botao.addEventListener("click", async () => {
                    const pedidoId = botao.dataset.pedidoId;
                    const proximoStatus = botao.dataset.proximoStatus;

                    botao.disabled = true;

                    try {
                        const resposta = await fetch(
                            `/api/pedidos/${pedidoId}/status?status=${proximoStatus}`,
                            {
                                method: "PUT",
                                credentials: "same-origin",
                                headers: {"X-XSRF-TOKEN": csrfToken}
                            }
                        );

                        if (!resposta.ok) {
                            const texto = await resposta.text();
                            throw new Error(
                                `Erro HTTP ${resposta.status}: ${texto || "Não foi possível atualizar o status."}`
                            );
                        }

                        window.location.reload();

                    } catch (erro) {
                        mostrarMensagem(erro.message || "Erro inesperado ao atualizar o status.");
                        botao.disabled = false;
                    }
                });
            });
        })();
    </script>
</div>
</body>
</html>
